[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-legal-case-intelligence"
version = "0.1.0"
description = "Traceable Indian IPC statute identification with CPU baselines and optional GPU experiments"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "PyMuPDF>=1.24,<3", "spacy>=3.8,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "streamlit>=1.40,<2", "joblib>=1.4,<2", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
reports = ["matplotlib>=3.9,<4"]
hf-data = ["huggingface_hub>=1,<3", "fsspec>=2024.9", "pyarrow>=17,<27"]
gpu = ["torch>=2.11,<2.12", "transformers>=5.22,<5.23", "safetensors>=0.8,<1", "huggingface_hub>=1.31,<3"]

[project.scripts]
legal-intelligence = "legal_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["artifacts", "data"]

